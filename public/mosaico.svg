<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Mosaico romano com medalhão central em ouro">
  <defs>
    <!-- Tesselas: quadrados assentados em diagonal, tons de porfiro -->
    <pattern id="tesserae" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#2a0c15"/>
      <rect x="6" y="6" width="19" height="19" fill="#42121f"/>
      <rect x="31" y="6" width="19" height="19" fill="#5b1a2b"/>
      <rect x="6" y="31" width="19" height="19" fill="#5b1a2b"/>
      <rect x="31" y="31" width="19" height="19" fill="#42121f"/>
      <rect x="25" y="25" width="6" height="6" fill="#8f3a52"/>
    </pattern>

    <pattern id="tesseraeGold" width="112" height="112" patternUnits="userSpaceOnUse">
      <rect x="20" y="20" width="6" height="6" fill="#a8841c" opacity="0.55"/>
      <rect x="76" y="48" width="6" height="6" fill="#a8841c" opacity="0.4"/>
      <rect x="48" y="92" width="6" height="6" fill="#c9a227" opacity="0.45"/>
    </pattern>

    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#8f3a52" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#5b1a2b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d0a09" stop-opacity="0.85"/>
    </radialGradient>

    <radialGradient id="medal" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#2a0c15"/>
      <stop offset="100%" stop-color="#151110"/>
    </radialGradient>

    <!-- Folha de louro, repetida em torno do medalhão -->
    <g id="leaf">
      <path d="M0,-6 C7,-16 22,-20 30,-14 C24,-5 12,1 0,0 Z" fill="#c9a227" opacity="0.92"/>
      <path d="M0,-4 C10,-12 22,-15 29,-13" fill="none" stroke="#e9d089" stroke-width="1.1" opacity="0.7"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#tesserae)"/>
  <rect width="1600" height="900" fill="url(#tesseraeGold)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Medalhão -->
  <g transform="translate(800 415)">
    <circle r="250" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.45"/>
    <circle r="232" fill="url(#medal)" stroke="#a8841c" stroke-width="2.5"/>
    <circle r="222" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.4"/>

    <!-- Coroa de louro -->
    <g>
      <use href="#leaf" transform="rotate(0) translate(196,0) scale(-1,1)"/>
      <use href="#leaf" transform="rotate(22.5) translate(196,0) scale(-1,1)"/>
      <use href="#leaf" transform="rotate(45) translate(196,0) scale(-1,1)"/>
      <use href="#leaf" transform="rotate(67.5) translate(196,0) scale(-1,1)"/>
      <use href="#leaf" transform="rotate(90) translate(196,0) scale(-1,1)"/>
      <use href="#leaf" transform="rotate(112.5) translate(196,0) scale(-1,1)"/>
      <use href="#leaf" transform="rotate(135) translate(196,0) scale(-1,1)"/>
      <use href="#leaf" transform="rotate(157.5) translate(196,0) scale(-1,1)"/>
      <use href="#leaf" transform="rotate(180) translate(196,0)"/>
      <use href="#leaf" transform="rotate(202.5) translate(196,0)"/>
      <use href="#leaf" transform="rotate(225) translate(196,0)"/>
      <use href="#leaf" transform="rotate(247.5) translate(196,0)"/>
      <use href="#leaf" transform="rotate(270) translate(196,0)"/>
      <use href="#leaf" transform="rotate(292.5) translate(196,0)"/>
      <use href="#leaf" transform="rotate(315) translate(196,0)"/>
      <use href="#leaf" transform="rotate(337.5) translate(196,0)"/>
    </g>

    <!-- Peça de dominó -->
    <g transform="translate(0 -74) rotate(-7)">
      <rect x="-34" y="-34" width="68" height="68" rx="8" fill="#ede4d3"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="#42121f" stroke-width="2.5" opacity="0.5"/>
      <text x="0" y="-7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#42121f">VI</text>
      <text x="0" y="25" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#42121f">III</text>
    </g>
  </g>

  <!-- Filete de borda -->
  <rect x="40" y="40" width="1520" height="820" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.3"/>
  <rect x="56" y="56" width="1488" height="788" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.18"/>
</svg>